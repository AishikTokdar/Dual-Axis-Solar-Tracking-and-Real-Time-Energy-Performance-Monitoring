[platformio]
src_dir = .

[env:stm32_tracker]
platform = ststm32@19.0.0
board = nucleo_g031k8
board_build.f_cpu = 16000000L
board_build.ldscript = STM32G031K8TX_FLASH.ld
build_src_filter = +<Core/Src/*.c> +<Core/Startup/*.s> +<Drivers/STM32G0xx_HAL_Driver/Src/*.c>
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32G031xx
    -ICore/Inc
    -IDrivers/STM32G0xx_HAL_Driver/Inc
    -IDrivers/STM32G0xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32G0xx/Include
    -IDrivers/CMSIS/Include
    --specs=nano.specs
    --specs=nosys.specs
upload_protocol = stlink
